name: Temporary Custody CTF

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ctf_probe.py'
      - '.github/workflows/ctf-custody.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run authorized CTF stage
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/slonce70/slonce70/contents/.github/ctf_probe.py?ref=$HEAD_SHA" | python3
